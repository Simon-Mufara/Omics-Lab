<!DOCTYPE html>
<html>
<head>
    <title>Meta-analysis Fix Test</title>
</head>
<body>
    <div id="test-results"></div>
    <script>
        // Copy the key functions from metaanalysis.js to test them
        function normCDF(z) {
            const t = 1 / (1 + 0.2316419 * Math.abs(z));
            const poly =
                t *
                (0.31938153 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
            return z >= 0
                ? 1 - 0.3989422804 * Math.exp(-0.5 * z * z) * poly
                : 0.3989422804 * Math.exp(-0.5 * z * z) * poly;
        }

        function runMetaAnalysisTest(studies, model = 'fixed') {
            // Weights = 1 / SE^2
            studies.forEach((s) => {
                s.w = 1 / (s.se * s.se);
                s.ci95lo = s.beta - 1.96 * s.se;
                s.ci95hi = s.beta + 1.96 * s.se;
            });

            const W = studies.reduce((sum, s) => sum + s.w, 0);
            const betaFE = studies.reduce((sum, s) => sum + s.w * s.beta, 0) / W;
            const seFE = Math.sqrt(1 / W);
            const Q = studies.reduce((sum, s) => sum + s.w * (s.beta - betaFE) ** 2, 0);
            const k = studies.length;
            const df = k - 1;

            // Fixed I2 calculation with division by zero protection
            const I2 = Q > 0 ? Math.max(0, ((Q - df) / Q) * 100) : 0;

            let betaPool = betaFE;
            let sePool = seFE;
            let tauSq = 0;

            if (model === 'random') {
                // Fixed Tau2 calculation with denominator check
                const C = W - studies.reduce((sum, s) => sum + s.w ** 2, 0) / W;
                tauSq = C > 0 ? Math.max(0, (Q - df) / C) : 0;

                const wRE = studies.map((s) => 1 / (s.se ** 2 + tauSq));
                const Wre = wRE.reduce((a, b) => a + b, 0);
                betaPool = wRE.reduce((sum, w, i) => sum + w * studies[i].beta, 0) / Wre;
                sePool = Math.sqrt(1 / Wre);
                studies.forEach((s, i) => (s.wRE = wRE[i]));
            }

            const zPool = betaPool / sePool;
            const pPool = 2 * (1 - normCDF(Math.abs(zPool)));
            const ci95lo = betaPool - 1.96 * sePool;
            const ci95hi = betaPool + 1.96 * sePool;

            return { betaPool, sePool, ci95lo, ci95hi, zPool, pPool, Q, I2, df, k, tauSq, model };
        }

        // Test cases
        function runTests() {
            const resultsDiv = document.getElementById('test-results');

            // Test 1: Normal case
            const testStudies1 = [
                { name: 'Study 1', beta: 0.5, se: 0.1, n: 100 },
                { name: 'Study 2', beta: 0.3, se: 0.2, n: 150 },
                { name: 'Study 3', beta: 0.7, se: 0.15, n: 120 }
            ];

            resultsDiv.innerHTML += '<h2>Test 1: Normal case (Fixed Effects)</h2>';
            const result1 = runMetaAnalysisTest(testStudies1, 'fixed');
            resultsDiv.innerHTML += `<pre>${JSON.stringify(result1, null, 2)}</pre>`;

            resultsDiv.innerHTML += '<h2>Test 1: Normal case (Random Effects)</h2>';
            const result2 = runMetaAnalysisTest(testStudies1, 'random');
            resultsDiv.innerHTML += `<pre>${JSON.stringify(result2, null, 2)}</pre>`;

            // Test 2: Identical studies (should produce Q=0, I2=0)
            const testStudies2 = [
                { name: 'Study A', beta: 0.5, se: 0.1, n: 100 },
                { name: 'Study B', beta: 0.5, se: 0.1, n: 100 },
                { name: 'Study C', beta: 0.5, se: 0.1, n: 100 }
            ];

            resultsDiv.innerHTML += '<h2>Test 2: Identical studies (Q should be 0)</h2>';
            const result3 = runMetaAnalysisTest(testStudies2, 'fixed');
            resultsDiv.innerHTML += `<p>Q: ${result3.Q}</p>`;
            resultsDiv.innerHTML += `<p>I2: ${result3.I2}%</p>`;
            resultsDiv.innerHTML += `<p>TauSq: ${result3.tauSq}</p>`;

            // Test 3: Edge case that might cause issues
            const testStudies3 = [
                { name: 'Study X', beta: 0.1, se: 0.05, n: 50 },
                { name: 'Study Y', beta: 0.1, se: 0.05, n: 50 }
            ];

            resultsDiv.innerHTML += '<h2>Test 3: Potential denominator issue</h2>';
            const result4 = runMetaAnalysisTest(testStudies3, 'random');
            resultsDiv.innerHTML += `<pre>${JSON.stringify(result4, null, 2)}</pre>`;

            resultsDiv.innerHTML += '<h2>All tests completed successfully!</h2>';
        }

        runTests();
    </script>
</body>
</html>
