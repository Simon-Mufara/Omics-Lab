<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>OmicsLab Facility Test - Milestone 1</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { overflow:hidden; height:100%; background:#060a14; color:#e0e0e0; font-family:sans-serif; }
        #loading {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            text-align:center; color:#00C4A0;
        }
        #loading.spinner {
            width:40px; height:40px; border:4px solid rgba(0,196,160,0.3);
            border-top:4px solid #00C4A0; border-radius:50%; animation:spin 1s linear infinite;
            margin:0 auto 20px;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .info {
            position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.5);
            padding:10px; border-radius:4px; font-size:14px;
            max-width:300px;
        }
        a { color:#00C4A0; }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading facility...</p>
    </div>
    <div class="info" id="info">
        <p>WASD / Arrow keys to move<br>Mouse to look<br>Space to jump</p>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Our facility module -->
    <script src="js/facility.js"></script>

    <script>
        // Wait for DOM content
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('container');
            const loadingEl = document.getElementById('loading');
            const infoEl = document.getElementById('info');

            // Initialize facility
            const facility = window.OmicsLab.Facility;
            const success = facility.init(container, {
                // options could go here
            });

            if (!success) {
                loadingEl.innerHTML = '<p style="color:#ff6b6b;">Failed to initialize facility. Check console.</p>';
                return;
            }

            // Hide loading after a short delay (assuming init is synchronous)
            setTimeout(() => {
                loadingEl.style.display = 'none';
                infoEl.style.display = 'block';
            }, 500);
        });
    </script>
</body>
</html>
